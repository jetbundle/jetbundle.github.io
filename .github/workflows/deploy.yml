name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          test -f .nojekyll && cp .nojekyll _site/
          cp -a _style _site/_style
          mkdir -p _site/physics _site/computation
          cp -a physics/. _site/physics/
          cp -a computation/. _site/computation/
      - name: Verify output
        run: |
          test -f _site/index.html && test -s _site/index.html
          test -f _site/styles.css
          test -f _site/physics/index.html
          test -f _site/physics/mechanics/index.html
          test -f _site/physics/mechanics/chapter-1/index.html
          test -f _site/physics/mechanics/chapter-2/index.html
          test -f _site/physics/mechanics/chapter-3/index.html
          test -f _site/physics/mechanics/chapter-4/index.html
          test -f _site/physics/architecture-linearity/index.html
          test -f _site/physics/architecture-linearity/chapter-1/index.html
          test -f _site/physics/architecture-linearity/chapter-1/widgets.js
          test -f _site/physics/architecture-linearity/chapter-1/VISUALIZATIONS.md
          test -f _site/computation/index.html
          test -f _site/computation/basics/index.html
          test -f _site/computation/widgets/memory-explorer.js
          test -f _site/_style/tokens.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
